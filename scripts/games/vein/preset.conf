# Vein Dedicated Server Preset
# Vein ships a native Linux dedicated server — Proton is NOT used.
# App ID 2131400 is the dedicated server (free, anonymous login).

# Required — game-specific, always set by preset
export STEAM_APP_ID=2131400
export GAME_EXECUTABLE=VeinServer.sh
export GAME_MODE=steam
export GAME_CONFIG=vein
# Download the native Linux server depot (default for other games is windows + Proton).
# NOTE: do NOT name this STEAM_PLATFORM — steamcmd.sh reads that to locate its own
# binary (/steamcmd/$STEAM_PLATFORM/steamcmd) and would fail to start.
export USE_LINUX_DEPOT=true

# Defaults — only applied when the user hasn't provided the variable
export SERVER_NAME="${SERVER_NAME:-Vein Server}"
export SERVER_PASSWORD="${SERVER_PASSWORD:-}"
export MAX_PLAYERS="${MAX_PLAYERS:-16}"
export GAME_PORT="${GAME_PORT:-7777}"
# Steam server-browser query port (OnlineSubsystemSteam GameServerQueryPort; Steam default 27015).
export QUERY_PORT="${QUERY_PORT:-27015}"

# Public listing in the in-game server browser (true|false)
export VEIN_PUBLIC="${VEIN_PUBLIC:-true}"

# Admin access — comma-separated SteamID64 values (optional)
export VEIN_SUPER_ADMIN_IDS="${VEIN_SUPER_ADMIN_IDS:-}"
export VEIN_ADMIN_IDS="${VEIN_ADMIN_IDS:-}"
