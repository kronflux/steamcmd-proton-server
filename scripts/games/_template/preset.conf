# <Game Name> Dedicated Server Preset
# Copy this directory to scripts/games/<name>/ (or /data/games/<name>/ for a
# no-rebuild overlay) and fill in the values. Directories starting with "_"
# are ignored by the module loader.

# Required — game-specific, always set by the preset
export STEAM_APP_ID=000000              # SteamDB app ID of the DEDICATED SERVER (or game files for mod-served games)
export GAME_EXECUTABLE=Server.exe       # Relative to GAME_DIR. Windows .exe → Proton; native launcher → also set game_start
export GAME_MODE=steam                  # steam | download | direct
export GAME_CONFIG=_template            # MUST equal the directory name

# Uncomment for games that need them:
# export NEEDS_DISPLAY=true             # Unity/UE servers that require an X display (Xvfb)
# export USE_LINUX_DEPOT=true           # native-Linux server: skip the Windows depot force
# export STEAM_INSTALL_SUBDIR=Sub       # SteamCMD installs into GAME_DIR/<Sub> instead of GAME_DIR
# export PROTON_APP_ID=000000           # only when the Proton prefix app ID differs from STEAM_APP_ID
# export WINETRICKS_VERBS="vcrun2017"   # Windows runtime libs to provision into the prefix

# Defaults — only applied when the user hasn't provided the variable
export SERVER_NAME="${SERVER_NAME:-My Server}"
export SERVER_PASSWORD="${SERVER_PASSWORD:-}"
export MAX_PLAYERS="${MAX_PLAYERS:-10}"
export GAME_PORT="${GAME_PORT:-7777}"
export QUERY_PORT="${QUERY_PORT:-27015}"
