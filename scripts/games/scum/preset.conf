# SCUM Dedicated Server Preset
# App ID 3792580 is the dedicated server

# Required — game-specific, always set by preset
export STEAM_APP_ID=3792580
export GAME_EXECUTABLE=SCUM/Binaries/Win64/SCUMServer.exe
export GAME_MODE=steam
export GAME_CONFIG=scum
export NEEDS_DISPLAY=true

# Defaults — only applied when the user hasn't provided the variable
export SERVER_NAME="${SERVER_NAME:-SCUM Server}"
export SERVER_PASSWORD="${SERVER_PASSWORD:-}"
export MAX_PLAYERS="${MAX_PLAYERS:-64}"
export GAME_PORT="${GAME_PORT:-7777}"
# Steam query / player-connect port — always GAME_PORT + 2 (raw UDP uses GAME_PORT + 1).
export QUERY_PORT="${QUERY_PORT:-7779}"

# Disable the BattlEye anti-cheat (not recommended)
export SCUM_DISABLE_BATTLEYE="${SCUM_DISABLE_BATTLEYE:-false}"

# Windows runtime libraries SCUM needs in the Wine prefix (Visual C++ + DirectX
# shader compiler + crypto). Installed once per prefix on first start.
export WINETRICKS_VERBS="${WINETRICKS_VERBS:-vcrun2017 d3dcompiler_47 crypt32}"

# SCUMServer.exe statically imports d3d11.dll; keep it available in the prefix.
# The server never creates a render device (it logs "does not render"), so no
# GPU/Vulkan is used — but without the DLL present the loader fails with
# c0000135 and the server exits instantly. See setup_proton_environment.
export PROTON_KEEP_D3D11="${PROTON_KEEP_D3D11:-true}"
