# Subnautica Dedicated Server Preset (community Windows server via Proton)

# Required — game-specific, always set by preset
export STEAM_APP_ID=447530
export GAME_EXECUTABLE=SubnauticaServer.exe
export GAME_MODE=steam
export GAME_CONFIG=subnautica

# Defaults — only applied when the user hasn't provided the variable
export SERVER_NAME="${SERVER_NAME:-Subnautica Docker Server}"
export SERVER_PASSWORD="${SERVER_PASSWORD:-}"
export MAX_PLAYERS="${MAX_PLAYERS:-100}"
export GAME_PORT="${GAME_PORT:-7777}"
export QUERY_PORT="${QUERY_PORT:-7778}"
