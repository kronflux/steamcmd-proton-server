# Log signature table: <extended-regex><TAB><actionable hint>
# Matched case-insensitively against the tail of server.log by scan_log_signatures().
# Users can add rules in ${DATA_DIR}/diagnostics.d/*.conf (same format, no rebuild).
Refusing to run with the root privileges	This game refuses to run as root: launch it via a non-root game_start (see the vein module pattern; set PUID/PGID).
err:module:.*not found|import_dll.*not found	A Windows DLL is missing from the Wine prefix: add the matching verb to WINETRICKS_VERBS and restart (set WINETRICKS_FORCE=true to force re-provisioning).
Couldn't find steamcmd at	A reserved Steam env name is overriding SteamCMD internals (never set STEAM_PLATFORM; audit custom container env vars).
state is 0x6 after update job	Corrupt Steam app manifest: delete steamapps/appmanifest_<appid>.acf under the install dir and restart to re-validate.
Failed to heartbeat|no connection string	The server cannot reach its relay/backend: check native-vs-Proton platform choice, port mappings, and NAT/forwarding.
__cxa_guard_acquire detected recursive initialization	Native library crashed during init — usually wrong-platform binaries (Windows vs Linux depot) or missing runtime libraries.
FAILED.*Invalid Password|ERROR \(Invalid Password\)	SteamCMD rejected the login: STEAM_PASSWORD is empty or wrong in the container env.
Account Logon Denied|Two-factor|TwoFactorCodeMismatch	Steam Guard required: set a CURRENT STEAM_GUARD_CODE for one start (the cached session re-primes), then clear it.
ForceInstallDirOverride took too long|Missing configuration	Slow volume I/O is delaying SteamCMD IPC: check disk health/array load; the pre-created steamapps dir usually mitigates this.
No module found for	GAME_CONFIG does not match any module: check spelling against scripts/games/ or your /data/games/ overlay.
Process appears dead \(0 CPU, 0 memory\)	The server process deadlocked or was OOM-killed: restart the container and check memory limits (UE servers want 8GiB+).
